[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "solercia-connect"
version = "0.4.0"
description = "Deterministic, official-first connectors for collaboration and service-management providers."
readme = "README.md"
requires-python = ">=3.12,<4"
authors = [{ name = "Solercia" }]
dependencies = [
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.46,<2"]
oauth = ["keyring>=25,<26"]
service = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.26,<2",
  "httpx2>=2,<3",
  "mypy>=1.13,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
solercia-connect = "solercia_connect.cli:app"
solercia-connect-service = "solercia_connect.service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/solercia_connect"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "live: opt-in provider contract test; requires SOLERCIA_CONNECT_LIVE=1 and dedicated credentials",
]

[tool.coverage.run]
branch = true
source = ["solercia_connect"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["solercia_connect"]
