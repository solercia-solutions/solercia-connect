<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Official-first routing with supervised browser fallback</title>
  <desc id="desc">A request is validated before any side effect and goes to the official adapter first. Typed transient failures are retried up to three attempts. Credential, identity, policy and malformed-data failures fail closed. The browser route runs only when the official reason is eligible, the environment makes the route available and the invocation passes --allow-browser-fallback.</desc>
  <defs>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
      .bg{fill:#f8fafc;stroke:#e2e8f0}
      .h{fill:#0f172a;font-size:22px;font-weight:700}
      .sub{fill:#475569;font-size:13px}
      .t{fill:#0f172a;font-size:14px;font-weight:600}
      .s{fill:#475569;font-size:12px}
      .n{fill:#6366f1;font-size:12px;font-weight:700}
      .c{fill:#334155;font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .ind{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}
      .grn{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5}
      .amb{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.5}
      .ros{fill:#fff1f2;stroke:#f43f5e;stroke-width:1.5}
      .ln{fill:none;stroke:#64748b;stroke-width:1.6}
      .dash{stroke-dasharray:5 4}
      .ah{fill:#64748b}
      @media (prefers-color-scheme:dark){
        .bg{fill:#0d1117;stroke:#30363d}
        .h,.t{fill:#e6edf3}
        .sub,.s{fill:#9da7b3}
        .n{fill:#a5b4fc}
        .c{fill:#c9d1d9}
        .box{fill:#161b22;stroke:#30363d}
        .ind{fill:#1c1f3a;stroke:#818cf8}
        .grn{fill:#0f2a20;stroke:#34d399}
        .amb{fill:#2b2111;stroke:#fbbf24}
        .ros{fill:#2d1218;stroke:#fb7185}
        .ln{stroke:#8b949e}
        .ah{fill:#8b949e}
      }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="539" rx="16"/>
  <text class="h" x="32" y="44">Official first, browser only when you say so</text>
  <text class="sub" x="32" y="66">Every step is fixed code: no LLM, randomness, free-text classification or unbounded wait picks a route.</text>

  <!-- Row 1 -->
  <rect class="box" x="32" y="130" width="190" height="70" rx="10"/>
  <text class="t" x="48" y="158">Request</text>
  <text class="s" x="48" y="179">target · account · capability</text>
  <rect class="box" x="254" y="130" width="190" height="70" rx="10"/>
  <text class="t" x="270" y="158">Validate</text>
  <text class="s" x="270" y="179">before any side effect</text>
  <rect class="box" x="476" y="130" width="210" height="70" rx="10"/>
  <text class="t" x="492" y="158">Official adapter</text>
  <text class="s" x="492" y="179">account-bound OAuth or API token</text>
  <rect class="grn" x="718" y="130" width="210" height="70" rx="10"/>
  <text class="t" x="734" y="158">Records + receipt</text>
  <text class="c" x="734" y="179">route = "official"</text>
  <path class="ln" d="M222 165 H252" marker-end="url(#a)"/>
  <path class="ln" d="M444 165 H474" marker-end="url(#a)"/>
  <path class="ln" d="M686 150 H716" marker-end="url(#a)"/>

  <!-- Retry loop -->
  <path class="ln" d="M546 130 C546 100 626 100 626 128" marker-end="url(#a)"/>
  <text class="s" x="586" y="94" text-anchor="middle">rate limit, timeout, network, provider down: 3 attempts max</text>

  <!-- Fail closed -->
  <path class="ln" d="M686 186 H700 V244 H716" marker-end="url(#a)"/>
  <rect class="ros" x="718" y="214" width="210" height="64" rx="10"/>
  <text class="t" x="734" y="240">Fail closed</text>
  <text class="s" x="734" y="261">credentials, identity, policy</text>

  <!-- Gate -->
  <path class="ln dash" d="M580 200 V308" marker-end="url(#a)"/>
  <rect class="ind" x="32" y="310" width="654" height="130" rx="12"/>
  <text class="t" x="48" y="338">Browser gate: all three must hold</text>
  <text class="n" x="48" y="366">1</text>
  <text class="s" x="66" y="366">the official route reports admin consent required, capability unavailable, or not configured</text>
  <text class="n" x="48" y="392">2</text>
  <text class="c" x="66" y="392">SOLERCIA_CONNECT_BROWSER_FALLBACK=true</text>
  <text class="s" x="372" y="392">makes the route available</text>
  <text class="n" x="48" y="418">3</text>
  <text class="s" x="66" y="418">this invocation passes</text>
  <text class="c" x="212" y="418">--allow-browser-fallback</text>
  <text class="s" x="396" y="418">for an allowlisted capability</text>

  <path class="ln" d="M686 375 H716" marker-end="url(#a)"/>
  <rect class="amb" x="718" y="310" width="210" height="130" rx="10"/>
  <text class="t" x="734" y="338">Supervised browser</text>
  <text class="s" x="734" y="360">dedicated Chromium profile</text>
  <text class="s" x="734" y="378">observed identity must match</text>
  <text class="s" x="734" y="396">the same record shape</text>
  <text class="c" x="734" y="422">route = "browser"</text>

  <text class="s" x="32" y="480">Each attempt, retry and fallback decision is a step in the receipt, so a caller can see which route answered and why.</text>
  <text class="s" x="32" y="500">The environment switch alone never authorizes a browser attempt.</text>
</svg>
