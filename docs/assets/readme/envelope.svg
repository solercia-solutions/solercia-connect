<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">The solercia.connect/v1 envelope</title>
  <desc id="desc">Anatomy of a run response: stable envelope fields, normalized records with the record schema and provenance, the execution receipt with its steps, and a typed error that never carries provider bodies or credentials.</desc>
  <defs>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
      .bg{fill:#f8fafc;stroke:#e2e8f0}
      .h{fill:#0f172a;font-size:22px;font-weight:700}
      .sub{fill:#475569;font-size:13px}
      .t{fill:#0f172a;font-size:14px;font-weight:600}
      .s{fill:#475569;font-size:12px}
      .code{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;fill:#334155;white-space:pre}
      .ky{fill:#4338ca}
      .st{fill:#047857}
      .lt{fill:#b45309}
      .cm{fill:#94a3b8}
      .br{fill:none;stroke-width:2}
      .a1{stroke:#6366f1}.a2{stroke:#10b981}.a3{stroke:#f59e0b}.a4{stroke:#f43f5e}
      @media (prefers-color-scheme:dark){
        .bg{fill:#0d1117;stroke:#30363d}
        .h,.t{fill:#e6edf3}
        .sub,.s{fill:#9da7b3}
        .code{fill:#161b22;stroke:#30363d}
        .m{fill:#c9d1d9}
        .ky{fill:#a5b4fc}
        .st{fill:#6ee7b7}
        .lt{fill:#fcd34d}
        .cm{fill:#6e7681}
        .a1{stroke:#818cf8}.a2{stroke:#34d399}.a3{stroke:#fbbf24}.a4{stroke:#fb7185}
      }
    </style>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="579" rx="16"/>
  <text class="h" x="32" y="44">One envelope for every answer</text>
  <text class="sub" x="32" y="66">What a run returns, trimmed. The CLI prints it on stdout; the HTTP service returns it as the response body.</text>

  <rect class="code" x="32" y="96" width="540" height="420" rx="12"/>
  <text class="m" x="48" y="126">{</text>
  <text class="m" x="48" y="148">  <tspan class="ky">"schema"</tspan>: <tspan class="st">"solercia.connect/v1"</tspan>,</text>
  <text class="m" x="48" y="170">  <tspan class="ky">"ok"</tspan>: <tspan class="lt">true</tspan>,</text>
  <text class="m" x="48" y="192">  <tspan class="ky">"operation"</tspan>: <tspan class="st">"run"</tspan>,</text>
  <text class="m" x="48" y="214">  <tspan class="ky">"status"</tspan>: <tspan class="st">"success"</tspan>,</text>
  <text class="m" x="48" y="236">  <tspan class="ky">"provider"</tspan>: <tspan class="st">"outlook"</tspan>,</text>
  <text class="m" x="48" y="258">  <tspan class="ky">"account"</tspan>: <tspan class="st">"user@example.com"</tspan>,</text>
  <text class="m" x="48" y="280">  <tspan class="ky">"route"</tspan>: <tspan class="st">"official"</tspan>,</text>
  <text class="m" x="48" y="302">  <tspan class="ky">"data"</tspan>: { <tspan class="ky">"records"</tspan>: [</text>
  <text class="m" x="48" y="324">    { <tspan class="ky">"schema"</tspan>: <tspan class="st">"solercia.connect/record/v1"</tspan>,</text>
  <text class="m" x="48" y="346">      <tspan class="cm">… normalized fields …</tspan></text>
  <text class="m" x="48" y="368">      <tspan class="ky">"provenance"</tspan>: { <tspan class="ky">"route"</tspan>: <tspan class="st">"official"</tspan>, … } }</text>
  <text class="m" x="48" y="390">  ] },</text>
  <text class="m" x="48" y="412">  <tspan class="ky">"receipt"</tspan>: { <tspan class="ky">"receipt_id"</tspan>: <tspan class="st">"…"</tspan>,</text>
  <text class="m" x="48" y="434">    <tspan class="ky">"capability"</tspan>: <tspan class="st">"mail.sent.list"</tspan>, <tspan class="ky">"final_reason"</tspan>: <tspan class="st">"success"</tspan>,</text>
  <text class="m" x="48" y="456">    <tspan class="ky">"selected_route"</tspan>: <tspan class="st">"official"</tspan>, <tspan class="ky">"steps"</tspan>: [ … ] },</text>
  <text class="m" x="48" y="478">  <tspan class="ky">"error"</tspan>: <tspan class="lt">null</tspan></text>
  <text class="m" x="48" y="500">}</text>

  <!-- Annotations -->
  <path class="br a1" d="M584 136 H592 V286 H584"/>
  <text class="t" x="606" y="196">Stable envelope</text>
  <text class="s" x="606" y="216">The same fields for success and failure, on</text>
  <text class="s" x="606" y="232">CLI stdout and in the HTTP response body.</text>

  <path class="br a2" d="M584 292 H592 V396 H584"/>
  <text class="t" x="606" y="316">Normalized records</text>
  <text class="s" x="606" y="336">Identical on both routes. provenance is the</text>
  <text class="s" x="606" y="352">only field that names the route that answered.</text>

  <path class="br a3" d="M584 402 H592 V462 H584"/>
  <text class="t" x="606" y="422">Execution receipt</text>
  <text class="s" x="606" y="442">Each attempt is a step: route, attempt,</text>
  <text class="s" x="606" y="458">outcome and reason code.</text>

  <path class="br a4" d="M584 468 H592 V484 H584"/>
  <text class="t" x="606" y="482">Typed error when ok is false</text>
  <text class="s" x="606" y="502">code, retryable, missing variable names,</text>
  <text class="s" x="606" y="518">remediation and cause category; never</text>
  <text class="s" x="606" y="534">provider bodies or credentials.</text>
</svg>
