spec_notes:
  - "Capacidad nueva: mail-inbox-list (spec nuevo). Requisitos a especificar: enrutamiento oficial-primero con fallback navegador explícito; ventana horaria con fin exclusivo; orden ascendente por instante de recepción; paridad de registro entre rutas; atestación de identidad canónica previa a la lectura; validación por registro en el runtime; vacío permanece vacío; comportamiento al alcanzar el tope de limit"
  - "Capacidad modificada mail-record-contract: MailMessage gana internet_message_id, folder (inbox|sent) y received_at, todos opcionales con default y DESPUÉS de attachments; internetMessageId entra al $select de mail.sent.list en ambas rutas; received_at es None en enviados y en Gmail; adición pura sin subida de versión de esquema"
  - "Capacidad modificada mail-query-limits: MailQuery.limit pasa de 1..100 a 1..1000, aplicable también a mail.sent.list; 1001 sigue siendo rechazado; el recorte de application.py se ajusta en consecuencia"
  - "Capacidad modificada capability-advertisement: doctor, providers, CAPABILITY_MATRIX, README.md, docs/runbooks/outlook.md, docs/USO-CON-AGENTES.md y agents/skills/solercia-connect/SKILL.md deben anunciar mail.inbox.list por ambas rutas"
  - "Escenarios en formato Dado/Cuando/Entonces con palabras clave RFC 2119 en español (DEBE, DEBERÍA, PUEDE), según openspec/config.yaml rules.specs"
  - "Escenario obligatorio: el $select de bandeja DEBE incluir el instante de envío; si se omite, cada registro falla cerrado con malformed_provider_data"
  - "Escenario obligatorio: una petición mail.sent.list equivalente DEBE conservar el mismo request_id/receipt_id que antes del cambio"
  - "Sin delta a los puertos: ports.py documenta la segunda operación de correo pero no cambia ninguna firma pública"
